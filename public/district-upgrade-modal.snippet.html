<!-- ════════════════════════════════════════════════════════════════
     District Upgrade Modal — paste this inside <body> in index.html
     (anywhere near the other overlays like #comingSoonOverlay)
     ════════════════════════════════════════════════════════════════ -->

<style>
  /* ── District Upgrade Overlay ── */
  #districtUpgradeOverlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 18, 10, 0.82);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    padding: 24px;
  }
  #districtUpgradeOverlay.on {
    opacity: 1;
    pointer-events: auto;
  }
  .upgrade-card {
    background: #0e1912;
    border: 1px solid rgba(62, 207, 122, 0.18);
    border-radius: 20px;
    padding: 36px 32px 30px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(62, 207, 122, 0.06);
    animation: upgradeSlideIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes upgradeSlideIn {
    from { transform: translateY(24px) scale(0.96); opacity: 0; }
    to   { transform: translateY(0) scale(1);       opacity: 1; }
  }
  .upgrade-lock-icon {
    width: 64px;
    height: 64px;
    background: rgba(62, 207, 122, 0.1);
    border: 1.5px solid rgba(62, 207, 122, 0.25);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    margin: 0 auto 18px;
  }
  .upgrade-district-emoji {
    font-size: 1.6rem;
  }
  .upgrade-title {
    font-size: 1.1rem;
    font-weight: 900;
    color: #e4f0e8;
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .upgrade-district-name {
    color: #3ecf7a;
  }
  .upgrade-subtitle {
    font-size: 0.85rem;
    color: rgba(228, 240, 232, 0.55);
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .upgrade-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .upgrade-btn-confirm {
    background: #3ecf7a;
    color: #061208;
    border: none;
    border-radius: 12px;
    padding: 13px 20px;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 900;
    cursor: pointer;
    transition: background 0.18s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .upgrade-btn-confirm:hover {
    background: #4ddf8a;
    transform: translateY(-1px);
  }
  .upgrade-btn-cancel {
    background: transparent;
    color: rgba(228, 240, 232, 0.45);
    border: 1px solid rgba(62, 207, 122, 0.12);
    border-radius: 12px;
    padding: 11px 20px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: color 0.18s, border-color 0.18s;
  }
  .upgrade-btn-cancel:hover {
    color: rgba(228, 240, 232, 0.7);
    border-color: rgba(62, 207, 122, 0.22);
  }
</style>

<div id="districtUpgradeOverlay" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="upgrade-card">
    <div class="upgrade-lock-icon">
      <span class="upgrade-district-emoji">🔒</span>
    </div>
    <div class="upgrade-title">
      السوق مغلق — <span class="upgrade-district-name"></span>
    </div>
    <p class="upgrade-subtitle">
      هذا السوق غير مشمول في اشتراكك الحالي.<br>
      يمكنك إضافته بدفع رسوم إضافية ورفع إيصال الدفع للمراجعة.
    </p>
    <div class="upgrade-actions">
      <button class="upgrade-btn-confirm" onclick="requestDistrictUpgrade()">
        <i class="fa-solid fa-lock-open"></i>
        فتح هذا السوق — ادفع وارفع الإيصال
      </button>
      <button class="upgrade-btn-cancel" onclick="closeDistrictUpgrade()">
        إلغاء
      </button>
    </div>
  </div>
</div>
