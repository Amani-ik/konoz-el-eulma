<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الخدمات القريبة | كنوز العلمة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Cinzel:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f2e8;
        --paper-card: #fffdf8;
        --paper-ink: #1f1f1f;
        --paper-muted: #6b6459;
        --paper-border: #d8d0c2;
        --paper-line: #e8e2d6;
        --paper-accent: #2d6a4f;
        --paper-accent-soft: #e7f3ed;
        --paper-highlight: #fff8e6;
        --shadow: 0 8px 28px rgba(44, 38, 28, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", sans-serif;
        background: var(--paper);
        color: var(--paper-ink);
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.35;
        background-image: radial-gradient(#d8d0c2 0.6px, transparent 0.6px);
        background-size: 12px 12px;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page-shell {
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }

      .title-block h1 {
        margin: 0 0 6px;
        font-family: "Cinzel", serif;
        font-size: clamp(24px, 3.8vw, 34px);
      }

      .title-block p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--paper-card);
        border: 1px solid var(--paper-border);
        color: var(--paper-accent);
        font-weight: 700;
        box-shadow: var(--shadow);
      }

      .service-nav {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 24px;
      }

      .service-nav button {
        border: 1px solid var(--paper-border);
        background: var(--paper-card);
        color: var(--paper-ink);
        padding: 12px 10px;
        border-radius: 16px;
        cursor: pointer;
        font-weight: 800;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          background 0.2s ease;
      }

      .service-nav button:hover,
      .service-nav button.active {
        transform: translateY(-2px);
        border-color: var(--paper-accent);
        background: var(--paper-accent-soft);
        color: var(--paper-accent);
      }

      .service-section {
        background: var(--paper-card);
        border: 1px solid var(--paper-border);
        border-radius: 24px;
        padding: 22px;
        margin-bottom: 18px;
        box-shadow: var(--shadow);
        scroll-margin-top: 90px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .section-head h2 {
        margin: 0;
        font-size: 22px;
      }

      .section-head span {
        color: var(--paper-muted);
        font-size: 13px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        padding: 16px;
        border-radius: 18px;
        background: linear-gradient(
          180deg,
          #fffef9 0%,
          var(--paper-highlight) 100%
        );
        border: 1px solid var(--paper-line);
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .card h3 {
        margin: 0;
        font-size: 18px;
      }

      .type-pill {
        display: inline-flex;
        align-items: center;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--paper-accent-soft);
        color: var(--paper-accent);
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .card p {
        margin: 6px 0;
        color: var(--paper-muted);
        line-height: 1.6;
      }

      .card .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .meta a,
      .meta span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-radius: 999px;
        background: var(--paper-accent-soft);
        color: var(--paper-accent);
        font-size: 13px;
        font-weight: 700;
        border: 1px solid transparent;
      }

      .meta a:hover {
        border-color: var(--paper-accent);
      }

      .tiktok-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(27, 26, 28, 0.08);
        color: #111;
        border: 1px solid rgba(27, 26, 28, 0.12);
      }

      .tiktok-link .tiktok-icon {
        width: 16px;
        height: 16px;
        display: inline-block;
        flex-shrink: 0;
      }

      @media (max-width: 900px) {
        .service-nav {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .cards {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .service-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .page-shell {
          padding: 18px 12px 56px;
        }
        .service-section {
          padding: 16px;
        }
      }
    </style>
  </head>

                  : "";

                  ? `<a href="${phoneHref}">📞 ${phoneValue}</a>`
                  : "";

      function setActiveButton(targetKey) {
        navButtons.forEach((button) => {
          button.classList.toggle(
            "active",
            button.dataset.target === targetKey,
          );
        });
      }

      function scrollToSection(targetKey) {
        const section = document.getElementById(targetKey);
        if (!section) return;
        section.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function handleHashChange() {
        const targetKey = location.hash.replace("#", "");
        if (!serviceData[targetKey]) return;
        setActiveButton(targetKey);
        requestAnimationFrame(() => scrollToSection(targetKey));
      }

      navButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const targetKey = button.dataset.target;
          setActiveButton(targetKey);
          history.replaceState(null, "", `#${targetKey}`);
          scrollToSection(targetKey);
        });
      });

      window.addEventListener("hashchange", handleHashChange);
      renderServices();
      handleHashChange();
