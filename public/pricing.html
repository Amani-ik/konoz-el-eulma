<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختر خطتك — كنوز العلمة</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="subscription.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="loader" class="loader">جاري التحميل…</div>

    <div id="pricingScreen" class="sub-shell hidden">
      <header class="sub-topbar">
        <a class="sub-brand" href="index.html">
          <img src="logo.png" alt="" />
          <span>كنوز العلمة</span>
        </a>
        <button
          type="button"
          class="sub-menu"
          onclick="location.href = 'index.html'"
          aria-label="القائمة"
        >
          ☰
        </button>
      </header>

      <nav class="stepper" aria-label="خطوات الاشتراك">
        <div class="stepper-item active">1. اختر خطتك</div>
        <div class="stepper-item">2. اختر الأسواق</div>
        <div class="stepper-item">3. رفع الإيصال</div>
      </nav>

      <div class="step-head">
        <h1>الخطوة 1: اختر خطتك</h1>
        <p>دفعة واحدة — اشتراك دائم</p>
        <span class="sub-badge"> تفعيل دائم للاشتراك </span>
      </div>

      <div class="plan-grid" id="plansList"></div>
      <p class="error-msg" id="errorMsg"></p>
    </div>

    <div
      id="districtModal"
      class="modal-backdrop hidden"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-card">
        <h2>الخطوة 2: اختر الأسواق</h2>
        <p id="districtHint">اختر الأسواق حسب خطتك</p>
        <div class="district-grid" id="districtsList"></div>
        <button type="button" class="primary-btn" id="confirmBtn" disabled>
          تأكيد والمتابعة إلى الدفع
        </button>
        <p class="error-msg" id="modalError"></p>
      </div>
    </div>

    <a
      id="csBtn"
      href="https://wa.me/213666666666"
      target="_blank"
      rel="noopener noreferrer"
      title="خدمة العملاء"
      aria-label="خدمة العملاء"
    >
      <i class="fa-solid fa-headset"></i>
    </a>

    <script type="module" src="pricing.js"></script>
  </body>
</html>
